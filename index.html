<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boda de Benjamín y Monserrat</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f9f7f1;
            color: #333;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .contenedor {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            font-family: 'Georgia', serif;
            font-size: 2.5em;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
            color: #555;
        }
        .fecha {
            font-weight: bold;
            font-size: 1.4em;
            margin: 20px 0;
            color: #d35400;
        }
        .formulario {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input, select, button {
            padding: 12px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            background-color: #2c3e50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1a252f;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Benjamín & Monserrat</h1>
        <p>Tenemos el honor de invitarte a celebrar nuestra boda.</p>
        <div class="fecha">Próximamente</div>
        <p>Por favor, confirma tu asistencia para ayudarnos con los preparativos.</p>
        
        <!-- Formulario visual (Aún no envía datos al servidor) -->
        <form class="formulario">
            <input type="text" placeholder="Tu nombre completo" required>
            <select required>
                <option value="" disabled selected>¿Asistirás?</option>
                <option value="si">Sí, ahí estaré</option>
                <option value="no">No podré asistir</option>
            </select>
            <input type="number" placeholder="Número de acompañantes" min="0" max="4" required>
            <button type="submit">Confirmar Asistencia</button>
        </form>
    </div>
</body>
</html>
